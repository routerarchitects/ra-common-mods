name: S3 Module CI

on:
  push:
    paths:
      - 's3/**'
      - '.github/workflows/s3.yml'
  pull_request:
    paths:
      - 's3/**'
      - '.github/workflows/s3.yml'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: s3/go.sum

      - name: Verify formatting, module checksums, and vet
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            printf 'Files require formatting:\n%s\n' "$diff"
            exit 1
          fi
          go mod download
          go mod verify
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: s3

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Start MinIO
        env:
          MINIO_ROOT_USER: s3-test-access
          MINIO_ROOT_PASSWORD: s3-test-password
        run: |
          release=RELEASE.2025-09-07T16-13-09Z
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/minio/minio/releases/download/$release/minio.linux-amd64.$release" \
            -o "$RUNNER_TEMP/minio"
          printf '%s  %s\n' '7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f' "$RUNNER_TEMP/minio" | sha256sum --check
          chmod +x "$RUNNER_TEMP/minio"
          MINIO_BROWSER=off "$RUNNER_TEMP/minio" server --address 127.0.0.1:9000 "$RUNNER_TEMP/minio-data" > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1

      - name: Run unit and MinIO integration tests with race detector
        env:
          TEST_S3_INTEGRATION: 'true'
          STORAGE_TYPE_S3_ENDPOINT: 'http://127.0.0.1:9000'
          STORAGE_TYPE_S3_ACCESS_KEY: s3-test-access
          STORAGE_TYPE_S3_SECRET_KEY: s3-test-password
        run: go test -count=1 -v -race ./...
