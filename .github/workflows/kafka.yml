name: Kafka Module CI

on:
  push:
    paths:
      - 'kafka/**'
      - '.github/workflows/kafka.yml'
  pull_request:
    paths:
      - 'kafka/**'
      - '.github/workflows/kafka.yml'

jobs:
  test:
    name: Format, Vet & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kafka

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kafka/go.mod
          cache-dependency-path: |
            kafka/go.sum
            kafka/examples/go.sum

      - name: Verify formatting, module checksums, and vet
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            printf 'Files require formatting:\n%s\n' "$diff"
            exit 1
          fi
          go mod download
          go mod verify
          go vet ./...

      - name: Run unit tests with race detector
        run: |
          go test -race -count=1 -v ./...
          go test -race -count=20 -run 'Test.*(Close|Shutdown|Rebalance|Concurrent|Lifecycle|Reconnect|DLQRetry)' ./...

      - name: Verify independent examples module
        run: |
          cd examples
          go mod download
          go mod verify
          go test -v ./...
          go build ./...

      - name: Scan Kafka and examples for Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go version
          kafka_vuln_db=https://vuln.go.dev
          govulncheck -db "$kafka_vuln_db" -version
          status=0
          govulncheck -db "$kafka_vuln_db" ./... || status=1
          govulncheck -db "$kafka_vuln_db" -tags=integration ./... || status=1
          (cd examples && govulncheck -db "$kafka_vuln_db" ./...) || status=1
          exit "$status"

  integration:
    name: Live Kafka Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kafka

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kafka/go.mod
          cache-dependency-path: kafka/go.sum

      - name: Start pinned Apache Kafka KRaft broker
        run: |
          docker run -d --name kafka-local -p 19092:19092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:19092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:19092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:3.7.2

          for attempt in $(seq 1 60); do
            if docker exec kafka-local /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1; then
              echo "Kafka broker ready on attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-local
          exit 1

      - name: Run integration tests with race detector
        env:
          KAFKA_TEST_BROKERS: 'localhost:19092'
          KAFKA_TEST_CONTAINER: 'kafka-local'
        run: go test -tags=integration -race -count=1 -timeout=10m -v ./...

      - name: Stop and remove Kafka container
        if: always()
        run: docker rm -f kafka-local || true
